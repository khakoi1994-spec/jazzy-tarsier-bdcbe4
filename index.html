```html
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Material Monitoring</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f3f5f7;
 color:#222
}
header{
 background:#1565c0;
 color:#fff;
 padding:18px 20px;
 display:flex;
 justify-content:space-between;
 align-items:center

header h1{margin:0;font-size:21px}

 border-radius:12px;
 box-shadow:0 2px 8px #0002
}

 margin:80px auto
}

 width:100%;
 padding:11px;

 padding:10px 15px;

 cursor:pointer;

.primary{background:#1565c0;color:#fff}

 display:grid;

 gap:10px

 flex-wrap:wrap;
 margin-top:10px
}

 width:100%;
 border-collapse:collapse;
 min-width:950px

 padding:10px;
 border-bottom:1px solid #ddd;
 font-size:13px
}

 background:#e3f2fd;
 color:#1565c0;
 padding:5px 9px;

}

 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
 gap:10px
}

 background:#f5f7fa;
 padding:13px;

}

 display:block;

 margin-top:5px
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginPage">

<div class="card login">

<h2>🔐 Login Material Monitoring</h2>

<p>Silakan masuk menggunakan akun Anda.</p>

<label>Email</label>
<input id="email" type="email" placeholder="Email">

<label>Password</label>
<input id="password" type="password" placeholder="Password">

<button class="primary" style="width:100%" onclick="login()">
Masuk
</button>

<p id="loginStatus"></p>

<!-- APLIKASI -->

<div id="app" class="hidden">

<header>

<h1>📦 Material Monitoring</h1>

<div>
<span id="userInfo"></span>
<button class="danger" onclick="logout()">Logout</button>
</div>

</header>


<div class="container">

<!-- ADMIN -->

<section id="adminSection" class="hidden">

<div class="card">

<h2>⚙️ ADMIN</h2>

<div class="grid">

<div>
<label>Team</label>
<input id="team">
</div>

<div>
<label>Part</label>
<input id="part">
</div>

<div>
<label>Description</label>
<input id="description">
</div>

<div>
<label>Unit</label>
<input id="unit">
</div>

<div>
<label>Harga</label>
<input id="harga" type="number">
</div>

<div>
<label>Stok Awal</label>
<input id="stokAwal" type="number">
</div>

<div>
<label>Total Ambil</label>
<input id="totalAmbil" type="number">
</div>

</div>

<div class="actions">

<button class="primary" onclick="saveData()">
💾 Simpan
</button>

<button class="secondary" onclick="resetForm()">
Reset
</button>

</div>

<p id="adminStatus"></p>

</div>

</section>


<!-- TEAM -->

<section>

<div class="card">

<h2>🔎 Data Team</h2>

<input
id="search"
placeholder="Cari Team, contoh H007"
oninput="render()"
>

<div class="summary">

<div class="box">
Team
<b id="sumTeam">-</b>
</div>

<div class="box">
Stok Awal
<b id="sumAwal">0</b>
</div>

<div class="box">
Total Ambil
<b id="sumAmbil">0</b>
</div>

<div class="box">
Sisa Gudang
<b id="sumSisa">0</b>
</div>

</div>

</div>


<div class="card">

<div class="table-wrap">

<table>

<thead>

<tr>
<th>Team</th>
<th>Part</th>
<th>Description</th>
<th>Unit</th>
<th>Harga</th>
<th>Stok Awal</th>
<th>Total Ambil</th>
<th>Sisa Gudang</th>
<th>Harg Sisa</th>
<th id="actionHead" class="hidden">Aksi</th>
</tr>

</thead>

<tbody id="tableBody"></tbody>

</table>

</div>

</div>

</section>

</div>

</div>


<script>

/* ================================
   SUPABASE
================================ */

const SUPABASE_URL =
"https://umfpogjgiqhtiuvazqdm.supabase.co";

const SUPABASE_KEY =
"sb_publishable_ijo6swvjf5X83TrDe4Xfpg_7rJz7dRs";

const API =
SUPABASE_URL + "/rest/v1";

const headers = {
 "apikey":SUPABASE_KEY,
 "Authorization":"Bearer "+SUPABASE_KEY,
 "Content-Type":"application/json"
};

let currentUser=null;
let profile=null;
let materials=[];


/* ================================
   LOGIN
================================ */

async function login(){

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

const status =
document.getElementById("loginStatus");

if(!email || !password){

status.className="error";
status.textContent="Email dan password wajib diisi.";
return;

}

status.className="";
status.textContent="Sedang login...";

try{

const response =
await fetch(
SUPABASE_URL+"/auth/v1/token?grant_type=password",
{
 method:"POST",
 headers:{
  "apikey":SUPABASE_KEY,
  "Content-Type":"application/json"
 },
 body:JSON.stringify({
  email:email,
  password:password
 })
}
);

const result =
await response.json();

if(!response.ok){

throw new Error(
result.msg ||
result.error_description ||
result.message ||
"Login gagal"
);

}

localStorage.setItem(
"access_token",
result.access_token
);

localStorage.setItem(
"refresh_token",
result.refresh_token
);

currentUser=result.user;

await loadProfile();

}catch(error){

status.className="error";
status.textContent=
"Gagal login: "+error.message;

}

}


/* ================================
   PROFILE
================================ */

async function loadProfile(){

const token =
localStorage.getItem("access_token");

const response =
await fetch(
API+"/profiles?id=eq."+currentUser.id+"&select=*",
{
 headers:{
  ...headers,
  "Authorization":"Bearer "+token
 }
}
);

if(!response.ok){

throw new Error(
await response.text()
);

}

const rows =
await response.json();

if(!rows.length){

throw new Error(
"Profile user belum dibuat di tabel profiles."
);

}

profile=rows[0];

document.getElementById("loginPage")
.classList.add("hidden");

document.getElementById("app")
.classList.remove("hidden");

document.getElementById("userInfo")
.textContent=
profile.role === "admin"
 ? "ADMIN"
 : "TEAM "+(profile.team || "-");


if(profile.role === "admin"){

document.getElementById("adminSection")
.classList.remove("hidden");

document.getElementById("actionHead")
.classList.remove("hidden");

}else{

document.getElementById("adminSection")
.classList.add("hidden");

document.getElementById("actionHead")
.classList.add("hidden");

}

await loadData();

}


/* ================================
   LOAD MATERIAL
================================ */

async function loadData(){

const token =
localStorage.getItem("access_token");

const response =
await fetch(
API+"/material?select=*",
{
 headers:{
  ...headers,
  "Authorization":"Bearer "+token
 }
}
);

if(!response.ok){

throw new Error(
await response.text()
);

}

materials =
await response.json();

render();

}


/* ================================
   RENDER
================================ */

function render(){

const search =
document.getElementById("search")
.value
.trim()
.toUpperCase();

let rows=materials;


/* ADMIN BOLEH MELIHAT SEMUA */

if(profile && profile.role !== "admin"){

rows =
rows.filter(function(row){

return String(row["Team"] || "")
.toUpperCase() ===
String(profile.team || "")
.toUpperCase();

});

}


/* PENCARIAN */

if(search){

rows =
rows.filter(function(row){

return (

String(row["Team"] || "")
.toUpperCase()
.includes(search)

||

String(row["Part"] || "")
.toUpperCase()
.includes(search)

||

String(row["Description"] || "")
.toUpperCase()
.includes(search)

);

});

}


/* SUMMARY */

document.getElementById("sumTeam")
.textContent =
profile && profile.role !== "admin"
 ? profile.team
 : (search || "SEMUA");


document.getElementById("sumAwal")
.textContent =
formatNumber(
rows.reduce(
(t,r)=>t+num(r["Stok Awal"]),0
)
);


document.getElementById("sumAmbil")
.textContent =
formatNumber(
rows.reduce(
(t,r)=>t+num(r["Total Ambil"]),0
)
);


document.getElementById("sumSisa")
.textContent =
formatNumber(
rows.reduce(
(t,r)=>t+num(r["Sisa Gudang"]),0
)
);


const body =
document.getElementById("tableBody");


if(!rows.length){

body.innerHTML=
'<tr><td colspan="10" style="text-align:center;padding:25px">Data tidak ditemukan.</td></tr>';

return;

}


body.innerHTML =
rows.map(function(row){

const action =
profile.role === "admin"
?
`<td>
<button class="secondary"
onclick="editData('${row.id}')">
Edit
</button>
</td>`
:
"";


return `

<tr>

<td>
<span class="badge">
${esc(row["Team"])}
</span>
</td>

<td>${esc(row["Part"])}</td>

<td>${esc(row["Description"])}</td>

<td>${esc(row["Unit"])}</td>

<td class="num">
${rupiah(row["Harga"])}
</td>

<td class="num">
${formatNumber(row["Stok Awal"])}
</td>

<td class="num">
${formatNumber(row["Total Ambil"])}
</td>

<td class="num">
<b>${formatNumber(row["Sisa Gudang"])}</b>
</td>

<td class="num">
${rupiah(row["Harg Sisa"])}
</td>

${action}

</tr>

`;

}).join("");

}


/* ================================
   SAVE
================================ */

async function saveData(){

if(profile.role !== "admin"){

return;

}

const record={

"Team":
document.getElementById("team").value.trim().toUpperCase(),

"Part":
document.getElementById("part").value.trim(),

"Description":
document.getElementById("description").value.trim(),

"Unit":
document.getElementById("unit").value.trim(),

"Harga":
num(document.getElementById("harga").value),

"Stok Awal":
num(document.getElementById("stokAwal").value),

"Total Ambil":
num(document.getElementById("totalAmbil").value)

};

record["Sisa Gudang"] =
record["Stok Awal"] -
record["Total Ambil"];

record["Harg Sisa"] =
record["Sisa Gudang"] *
record["Harga"];


if(!record["Team"]){

showAdminStatus(
"Team wajib diisi.",
false
);

return;

}


const token =
localStorage.getItem("access_token");

try{

const response =
await fetch(
API+"/material",
{
 method:"POST",
 headers:{
  ...headers,
  "Authorization":"Bearer "+token,
  "Prefer":"return=representation"
 },
 body:JSON.stringify(record)
}
);

if(!response.ok){

throw new Error(
await response.text()
);

}

showAdminStatus(
"Data berhasil disimpan.",
true
);

resetForm();

await loadData();

}catch(error){

showAdminStatus(
"Gagal menyimpan: "+error.message,
false
);

}

}


/* ================================
   EDIT
================================ */

async function editData(id){

const row =
materials.find(
x=>String(x.id)===String(id)
);

if(!row)return;


document.getElementById("team").value =
row["Team"] || "";

document.getElementById("part").value =
row["Part"] || "";

document.getElementById("description").value =
row["Description"] || "";

document.getElementById("unit").value =
row["Unit"] || "";

document.getElementById("harga").value =
row["Harga"] || 0;

document.getElementById("stokAwal").value =
row["Stok Awal"] || 0;

document.getElementById("totalAmbil").value =
row["Total Ambil"] || 0;

document.getElementById("adminStatus")
.textContent=
"Data dimuat untuk diedit. Untuk versi berikutnya kita bisa tambahkan tombol Update.";

window.scrollTo({
top:0,
behavior:"smooth"
});

}


/* ================================
   LOGOUT
================================ */

function logout(){

localStorage.removeItem("access_token");
localStorage.removeItem("refresh_token");

location.reload();

}


/* ================================
   HELPERS
================================ */

function num(v){

return Number(v)||0;

}

function formatNumber(v){

return new Intl.NumberFormat("id-ID")
.format(num(v));

}

function rupiah(v){

return new Intl.NumberFormat(
"id-ID",
{
style:"currency",
currency:"IDR",
maximumFractionDigits:0
}
).format(num(v));

}

function esc(v){

return String(v ?? "")
.replace(/[&<>"']/g,function(m){

return {
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[m];

});

}

function resetForm(){

document.getElementById("team").value="";
document.getElementById("part").value="";
document.getElementById("description").value="";
document.getElementById("unit").value="";
document.getElementById("harga").value="";
document.getElementById("stokAwal").value="";
document.getElementById("totalAmbil").value="";

}

function showAdminStatus(text,ok){

const el =
document.getElementById("adminStatus");

el.textContent=text;

el.className=
ok ? "success" : "error";

}


/* ================================
   CEK SESSION
================================ */

async function checkSession(){

const token =
localStorage.getItem("access_token");

if(!token)return;

try{

const response =
await fetch(
SUPABASE_URL+"/auth/v1/user",
{
 headers:{
  "apikey":SUPABASE_KEY,
  "Authorization":"Bearer "+token
 }
}
);

if(!response.ok){

logout();
return;

}

currentUser =
await response.json();

await loadProfile();

}catch(error){

console.error(error);

}

}

checkSession();

</script>

</body>
</html>
```
